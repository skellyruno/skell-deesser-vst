            $reader = [System.IO.StreamReader]::new($entries[0].Open())
            try { $json = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $temp = Join-Path $env:RUNNER_TEMP 'skelly-moduleinfo-from-archive.json'
            [System.IO.File]::WriteAllText($temp, $json)
            python scripts/repair_vst3_moduleinfo.py $temp
            if ($LASTEXITCODE -ne 0) { throw 'Archived VST3 metadata is invalid' }
          } finally { $zip.Dispose() }
