name: Build Skelly DeEsser
on: [workflow_dispatch, push]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build Windows VST3 only
        run: cmake --build build --config Release --target SkellyDeEsser_VST3 --parallel 2
      - name: Validate and normalize VST3 metadata
        shell: pwsh
        run: |
          python scripts/repair_vst3_moduleinfo.py --selftest
          if ($LASTEXITCODE -ne 0) { throw 'Metadata regression tests failed' }
          $plugins = @(Get-ChildItem build -Directory -Recurse -Filter 'Skelly DeEsser.vst3')
          if ($plugins.Count -ne 1) { throw "Expected one VST3 bundle; found $($plugins.Count)" }
          $metadata = Join-Path $plugins[0].FullName 'Contents/Resources/moduleinfo.json'
          if (!(Test-Path -LiteralPath $metadata)) { throw 'moduleinfo.json missing' }
          python scripts/repair_vst3_moduleinfo.py $metadata --fix
          if ($LASTEXITCODE -ne 0) { throw 'VST3 metadata repair failed' }
          python scripts/repair_vst3_moduleinfo.py $metadata
          if ($LASTEXITCODE -ne 0) { throw 'VST3 metadata strict validation failed' }
      - name: Package
        shell: pwsh
        run: |
          $plugins = @(Get-ChildItem build -Directory -Recurse -Filter 'Skelly DeEsser.vst3')
          if ($plugins.Count -ne 1) { throw "Expected one VST3 bundle; found $($plugins.Count)" }
          Compress-Archive -Path $plugins[0].FullName -DestinationPath SkellyDeEsser-Windows-VST3.zip
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $PWD 'SkellyDeEsser-Windows-VST3.zip'))
          try {
            $entries = @($zip.Entries | Where-Object { $_.FullName -match '(^|/)moduleinfo\\.json
      - uses: actions/upload-artifact@v6
        with:
          retention-days: 1
          name: SkellyDeEsser-Windows-VST3
          path: SkellyDeEsser-Windows-VST3.zip
      # CI-only validation; no runtime dependencies added to the VST3.
      - name: pluginval VST3 host validation (strictness 5)
        shell: pwsh
        run: |
          $plugin = Get-ChildItem build -Directory -Recurse -Filter 'Skelly DeEsser.vst3' | Select-Object -First 1
          if (!$plugin) { throw 'VST3 bundle missing before pluginval' }
          Invoke-WebRequest 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip' -OutFile pluginval_Windows.zip
          Expand-Archive pluginval_Windows.zip -DestinationPath pluginval_bin -Force
          $validator = Get-ChildItem pluginval_bin -File -Recurse -Filter 'pluginval.exe' | Select-Object -First 1
          if (!$validator) { throw 'pluginval.exe missing from pinned release' }
          # pluginval.exe is a GUI-subsystem executable. PowerShell's &
          # operator can return early, leaving LASTEXITCODE unset. Wait for
          # the real process and read its exit code instead.
          $pluginArg = '"' + $plugin.FullName + '"'
          $result = Start-Process -FilePath $validator.FullName -ArgumentList @('--strictness-level', '5', $pluginArg) -PassThru -Wait -NoNewWindow
          if ($result.ExitCode -ne 0) { throw "pluginval validation failed with $($result.ExitCode)" }

  dsp-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run DSP tests with GCC and UBSan
        shell: bash
        run: |
          CXX=g++ bash tests/run_smoke.sh
          for test in filter_smoke waveform_smoke engine_smoke band_regression engine_regression phrase_aware_regression phrase_gate_regression filter_automation_regression extreme_stress realtime_alloc_stress detector_startup_regression waveform_idle_regression block_partition_regression transparent_idle_regression quiet_detector_regression gain_blend_regression; do
            extra=()
            if [[ "$test" == "realtime_alloc_stress" ]]; then extra+=(-Wno-mismatched-new-delete); fi
            g++ -std=c++17 -O1 -g -fsanitize=undefined -fno-sanitize-recover=all "${extra[@]}" -Itests/juce_stub "tests/${test}.cpp" -o "/tmp/skelly_ubsan_${test}"
            "/tmp/skelly_ubsan_${test}"
          done

  clang-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Clang DSP regressions
        shell: bash
        run: CXX=clang++ bash tests/run_smoke.sh
      - name: Extreme stress under ASan and UBSan
        shell: bash
        run: |
          clang++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -Itests/juce_stub tests/extreme_stress.cpp -o /tmp/skelly_extreme_asan
          ASAN_OPTIONS=detect_leaks=1 /tmp/skelly_extreme_asan
      - name: Compact UI geometry checks
        run: python3 tests/ui_layout_check.py
 })
