name: Build Skelly DeEsser
on: [workflow_dispatch, push]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Package
        shell: pwsh
        run: |
          $plugin = Get-ChildItem build -Directory -Recurse -Filter 'Skelly DeEsser.vst3' | Select-Object -First 1
          if (!$plugin) { throw 'VST3 bundle missing' }
          Compress-Archive -Path $plugin.FullName -DestinationPath SkellyDeEsser-Windows-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: SkellyDeEsser-Windows-VST3
          path: SkellyDeEsser-Windows-VST3.zip
      - name: Verify and package Standalone
        shell: pwsh
        run: |
          $standalone = Get-ChildItem build -File -Recurse -Filter '*.exe' |
            Where-Object { $_.FullName -like '*Standalone*' -and $_.Name -like '*Skelly*' } |
            Select-Object -First 1
          if (!$standalone) { throw 'Standalone executable missing' }
          Compress-Archive -Path $standalone.FullName -DestinationPath SkellyDeEsser-Windows-Standalone.zip
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: SkellyDeEsser-Windows-Standalone
          path: SkellyDeEsser-Windows-Standalone.zip

  dsp-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run DSP tests with GCC and UBSan
        shell: bash
        run: |
          CXX=g++ bash tests/run_smoke.sh
          for test in filter_smoke waveform_smoke engine_smoke band_regression engine_regression phrase_aware_regression phrase_gate_regression filter_automation_regression extreme_stress realtime_alloc_stress; do
            extra=()
            if [[ "$test" == "realtime_alloc_stress" ]]; then extra+=(-Wno-mismatched-new-delete); fi
            g++ -std=c++17 -O1 -g -fsanitize=undefined -fno-sanitize-recover=all "${extra[@]}" -Itests/juce_stub "tests/${test}.cpp" -o "/tmp/skelly_ubsan_${test}"
            "/tmp/skelly_ubsan_${test}"
          done

  clang-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clang DSP regressions
        shell: bash
        run: CXX=clang++ bash tests/run_smoke.sh
      - name: Extreme stress under ASan and UBSan
        shell: bash
        run: |
          clang++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -Itests/juce_stub tests/extreme_stress.cpp -o /tmp/skelly_extreme_asan
          ASAN_OPTIONS=detect_leaks=1 /tmp/skelly_extreme_asan
      - name: Compact UI geometry checks
        run: python3 tests/ui_layout_check.py
